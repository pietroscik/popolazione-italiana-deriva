name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Dati ISTAT (pipeline end-to-end)
        run: |
          python3 src/download_istat.py
          python3 src/parse_istat.py
      - run: python3 -m unittest discover tests -v
